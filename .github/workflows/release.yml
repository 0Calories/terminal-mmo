# Selective release pipeline (ADR 0004). Fires on a `v*` tag
# (or manual dispatch of one) and ships ONLY what the tag changed: the diff since
# the previous release is classified by @mmo/core's release manifest into a shape
# — both | server | client | none — and each artifact ships or stays put
# accordingly. A client-only release never restarts the server; a doc-only
# release ships nothing.
#
# The gates are content-derived, not configured: every checkout is stamped
# (build-info.json: version/gitSha/contractHash) before anything ships, and
# - server-shipping shapes deploy first, then assert /health.gitSha equals the
#   tagged commit before the irreversible npm publish (deploy-first/publish-last);
# - the client-only shape deploys nothing and instead asserts the live server's
#   /health.contractHash equals the hash this checkout would bake into the client.
# The workflow_dispatch force input is the escape hatch: ship everything.
#
# npm auth uses npm Trusted Publishing (OIDC) — NO npm token. The job requests an
# OIDC identity token (`id-token: write`) that npm exchanges for a short-lived,
# single-use publish credential, and stamps build provenance automatically. This
# workflow file's path must be registered as the Trusted Publisher on the
# `terminal-mmo` package (npmjs.com → package → Settings → Publishing access).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to ship (vX.Y.Z; must already exist)'
        required: true
        type: string
      force_ship_everything:
        description: 'Escape hatch: ignore the computed shape and ship both artifacts'
        required: false
        default: false
        type: boolean

permissions:
  contents: write # create the GitHub Release at the end
  id-token: write # required for npm Trusted Publishing (OIDC) + provenance

env:
  # The Railway service to deploy, kept as a repo variable (Settings → Secrets and
  # variables → Actions → Variables) so the live service name lives in config, not
  # code. (HEALTH_URL is derived at runtime from the client's single source of
  # truth — see the "Derive health URL" step below.)
  RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
  # Tag push: the pushed tag. Manual dispatch: the tag input.
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          # Full history + tags: the shape step diffs against the previous release.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # Node + a current npm (>= 11.5.1) are what perform the OIDC publish.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Upgrade npm (OIDC trusted publishing needs >= 11.5.1)
        run: npm install -g npm@latest

      - name: Install
        run: bun install --frozen-lockfile

      # The tag is the single source of truth for the Version (`v0.3.0` -> `0.3.0`)
      # and for the commit every identity gate below compares against.
      - name: Derive version and commit from tag
        run: |
          echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=$(git rev-parse "$RELEASE_TAG^{commit}")" >> "$GITHUB_ENV"

      # The prod host has ONE definition — packages/client/src/server-url.ts, which
      # the client also bakes into its bundle. Read it by path (no workspace install
      # needed) so the /health gates can never target a different host than players do.
      - name: Derive health URL from the client's single source of truth
        run: |
          HOST="$(bun -e 'import { PROD_SERVER_HOST } from "./packages/client/src/server-url.ts"; process.stdout.write(PROD_SERVER_HOST)')"
          echo "HEALTH_URL=https://$HOST/health" >> "$GITHUB_ENV"

      # Re-run the full gate on the tagged commit before shipping anything.
      - name: CI gate
        run: bun run ci

      # build-info.json (gitignored) rides the `railway up` upload into the image
      # and is read by the client bundle build — both artifacts get one identity.
      - name: Stamp the build
        run: bun run stamp --version "$VERSION"

      # All classification logic lives in scripts/release-shape.ts (unit-tested);
      # this step is a dumb caller.
      - name: Compute release shape
        run: |
          SHAPE="$(bun run scripts/release-shape.ts --tag "$RELEASE_TAG" ${{ inputs.force_ship_everything && '--force' || '' }})"
          echo "SHAPE=$SHAPE" >> "$GITHUB_ENV"
          echo "release shape: $SHAPE" >> "$GITHUB_STEP_SUMMARY"

      # --- Server artifact (shapes: both, server) --------------------------------
      # --ci streams the build and fails fast — safe now that the service's watch
      # paths are cleared, so an upload always builds. --no-gitignore ships the
      # gitignored stamp; .railwayignore re-lists the real exclusions.
      - name: Deploy server to Railway
        if: env.SHAPE == 'both' || env.SHAPE == 'server'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: bunx @railway/cli up --ci -y --no-gitignore --service "$RAILWAY_SERVICE"

      # Unforgeable identity gate: the running process reports the gitSha stamped
      # into the image it booted from — a stale container can never pass. Polls
      # generously (90 × 5s ≈ 7.5 min) to span build → deploy → healthy.
      - name: Assert /health reports the tagged commit
        if: env.SHAPE == 'both' || env.SHAPE == 'server'
        run: |
          for i in $(seq 1 90); do
            body="$(curl -fsS "$HEALTH_URL" || true)"
            got="$(printf '%s' "$body" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).gitSha' 2>/dev/null || true)"
            echo "attempt $i: server reports '${got}', want '${RELEASE_SHA}'"
            if [ "$got" = "$RELEASE_SHA" ]; then
              echo "deploy confirmed at $RELEASE_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "::error::server never reported gitSha $RELEASE_SHA — refusing to publish"
          exit 1

      # --- Client-only compatibility gate (shape: client) ------------------------
      # No deploy, no restart, nobody kicked. Instead prove the client this
      # checkout is about to bake is compatible with the server already running:
      # the local contract hash must equal the live /health.contractHash.
      - name: Assert live server matches this client's contract hash
        if: env.SHAPE == 'client'
        run: |
          LOCAL="$(bun -e 'import { computeContractHash } from "./packages/assets/src/index.ts"; process.stdout.write(computeContractHash())')"
          LIVE="$(curl -fsS "$HEALTH_URL" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).contractHash')"
          echo "local contract hash: $LOCAL"
          echo "live  contract hash: $LIVE"
          if [ "$LOCAL" != "$LIVE" ]; then
            echo "::error::contract hash mismatch — the live server would reject this client. A client-only shape should be impossible here (a contract change ships both); refusing to publish. Investigate, or force-ship everything via workflow_dispatch."
            exit 1
          fi

      # --- Client artifact (shapes: both, client), via OIDC ----------------------
      # prepublishOnly runs build.ts, which reads build-info.json for
      # version/gitSha and bakes the contract hash itself.
      - name: Publish terminal-mmo to npm (Trusted Publishing)
        if: env.SHAPE == 'both' || env.SHAPE == 'client'
        working-directory: packages/cli
        run: |
          # Drop the workspace-only devDependencies (@mmo/client, @mmo/core,
          # `workspace:*`): npm can't parse that protocol, and they're build-time
          # only — the bundle inlines them, so nothing ships them. bun resolves the
          # build from the root workspace node_modules regardless. Do this FIRST so
          # the version bump below never has to look at a `workspace:` spec.
          npm pkg delete devDependencies
          # Stamp the release Version with `npm pkg set`, NOT `npm version`: the
          # latter reifies the dependency tree (the whole bun workspace — every
          # sibling still carries `workspace:*`), and npm aborts with
          # EUNSUPPORTEDPROTOCOL. `npm pkg set` only rewrites the JSON field.
          npm pkg set version="$VERSION"
          npm publish --access public

      # --- Record the release on GitHub (notes + history) ------------------------
      # Always states which artifacts actually shipped; a 'none' release is a
      # recorded no-op. Edits instead of failing when the release already exists
      # (a forced re-run of a tag).
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$SHAPE" in
            both)   SHIPPED="server @ $RELEASE_SHA; client v$VERSION on npm" ;;
            server) SHIPPED="server @ $RELEASE_SHA; client not republished" ;;
            client) SHIPPED="client v$VERSION on npm; server not restarted" ;;
            none)   SHIPPED="nothing — no shippable paths changed" ;;
          esac
          BODY="**Shape: $SHAPE.** Shipped: $SHIPPED."
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes "$BODY"
          else
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes --notes "$BODY"
          fi
